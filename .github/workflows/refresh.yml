name: Refresh data

# Runs the refresh scripts on GitHub's servers and publishes the data files to the live site.
# No AI model is involved: the scripts fetch, check and write the data themselves.
# The timetable and the reasons for it are in scripts/SCHEDULE.md.

on:
  schedule:
    # Twice an hour from about 6:45 am to 10:45 pm Eastern, in both winter and summer time.
    # GitHub reads this in UTC, starts scheduled jobs late and sometimes skips them. Two start times an hour
    # give it two chances. scripts/refresh.py refreshes only what is behind, so a second start usually does nothing.
    - cron: '17,47 10-23,0-4 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: 'Leave empty to refresh whatever is behind, or type: --all, or any of: news crypto economy markets'
        required: false
        default: ''
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/refresh.yml', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the live branch, whichever branch "Run workflow" was started from.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Skip the hours outside 6:47 am to 10:47 pm Eastern
        id: hours
        run: |
          slot=$(TZ=America/New_York date -d '40 minutes ago' +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$slot" -lt 6 ] || [ "$slot" -gt 22 ]; }; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh and check the data files
        id: refresh
        if: steps.hours.outputs.run == 'yes'
        env:
          STEPS: ${{ github.event.inputs.steps }}
        run: python3 scripts/refresh.py $STEPS

      - name: Publish what changed
        if: steps.hours.outputs.run == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.js crypto-data.js economy-data.js markets-data.js
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Refresh data $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          # Never force-push. If the branch moved while this ran, replay the one commit on top and try once more.
          git push origin HEAD:gh-pages || { git pull --rebase origin gh-pages && git push origin HEAD:gh-pages; }

      # Good files are published above. A step that failed still turns the run red, so it cannot go unnoticed.
      - name: Fail the run if a refresh step failed
        if: steps.refresh.outputs.failed == '1'
        run: |
          echo "A refresh step failed. See the summary of this run. The published copy of that file was kept."
          exit 1
